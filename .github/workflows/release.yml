name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Releases ship from main only: refuse tags that point outside main.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Merge dev into main, then tag."
            exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: hrns-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi

  # One job publishes everything, after all builds succeed.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          files=$(find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \))
          echo "$files"
          cat > notes.md <<'NOTES'
          Downloads:
          - **macOS (Apple Silicon)**: `hrns_*_aarch64.dmg`
          - **macOS (Intel)**: `hrns_*_x64.dmg`
          - **Windows**: `hrns_*_x64-setup.exe` or `.msi`

          The builds are unsigned. On macOS, right-click the app and choose Open the first time (or run `xattr -dr com.apple.quarantine /Applications/hrns.app`). On Windows, choose "More info → Run anyway" in SmartScreen.

          Requires the Codex CLI, signed in with ChatGPT.
          NOTES
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files -R "$GITHUB_REPOSITORY" --title "hrns $TAG" --notes-file notes.md
          fi
