[package]
name = "hrns-cli"
version = "0.1.0"
description = "hrns in the terminal: the real Codex agent on your ChatGPT plan, with the desktop's chats, accounts and usage"
license = "MIT"
repository = "https://github.com/GhaythBenAbid/hrns"
edition = "2021"

[[bin]]
name = "hrns"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs"] }
unicode-width = "0.2.3"
uuid = { version = "1.29.0", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
