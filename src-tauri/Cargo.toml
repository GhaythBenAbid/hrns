[package]
name = "hrns"
version = "0.1.0"
description = "A fast, battery-friendly desktop app for Codex"
license = "MIT"
repository = "https://github.com/GhaythBenAbid/hrns"
edition = "2021"

[lib]
name = "hrns_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs", "net"] }
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["ws"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
